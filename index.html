<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wajib Join Grup</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
}

video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:-1;
}

.container{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:380px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:30px;
    text-align:center;
    color:#fff;
    box-shadow:0 8px 35px rgba(0,0,0,.35);
}

.logo{
    width:100px;
    height:100px;
    border-radius:50%;
    border:3px solid #25D366;
    object-fit:cover;
    margin-bottom:20px;
}

h2{
    margin-bottom:15px;
}

.notice{
    background:rgba(37,211,102,.15);
    border:1px solid rgba(37,211,102,.5);
    color:#fff;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
}

.notice p{
    font-size:14px;
    line-height:22px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:17px;
    cursor:pointer;
    margin-top:15px;
    transition:.3s;
}

button:hover{
    transform:scale(1.03);
}

.join{
    background:#25D366;
    color:#fff;
}

.success{
    display:none;
    margin-top:20px;
    background:rgba(30,203,103,.25);
    border:1px solid rgba(30,203,103,.6);
    color:#fff;
    padding:15px;
    border-radius:15px;
    font-weight:bold;
}

.download{
    display:none;
    background:#fff;
    color:#25D366;
    font-weight:bold;
}
</style>

</head>
<body>

<video autoplay muted loop playsinline>
    <source src="begron.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

<div class="card">

<img src="logo.jpg" class="logo">

<h2>📢 WAJIB JOIN GRUP</h2>

<div class="notice">
<p>
Wajib join grup untuk mengetahui informasi update APK.<br><br>
Kami membagikan APK secara gratis sebagai bentuk berbagi kepada seluruh pengguna.
</p>
</div>

<button class="join" onclick="joinGroup()">
🚀 MASUK GRUP WHATSAPP
</button>

<div class="success" id="success">
✅ Terima kasih! Silakan lanjut download.
</div>

<button class="download" id="download" onclick="downloadApk()">
⬇ DOWNLOAD APK
</button>

</div>

</div>

<script>
function joinGroup(){
    window.open("https://chat.whatsapp.com/GA2US3uqWMwHCkfV7L48Jb?s=cl&p=a&ilr=1");

    setTimeout(function(){
        document.getElementById("success").style.display="block";
        document.getElementById("download").style.display="block";
    },3000);
}

function downloadApk(){
    window.location.href="https://www.mediafire.com/file/rs0uhj0l8bfs8ud/app-release_%252814%2529.apk/file";
}
</script>

</body>
</html>
